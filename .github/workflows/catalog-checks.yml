name: Catalog checks
on:
  push:
    branches: [main, feature/catalog-foundation]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node scripts/build-catalog.mjs --help
