name: Catalog and request checks
on:
  push:
    branches: [main, feature/catalog-foundation, feature/request-pipeline]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run test suite and syntax checks
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log
      - name: Validate catalog help command
        run: node scripts/build-catalog.mjs --help
      - name: Preserve failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ github.run_number }}
          path: test-output.log
          if-no-files-found: ignore
          retention-days: 7
